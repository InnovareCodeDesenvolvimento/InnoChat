name: CI

# Roda em toda push/PR contra `main`. O Easypanel faz auto-deploy a cada push em `main`
# (docs/arquitetura.md), então este workflow é a única rede de segurança ANTES de produção:
# lint, typecheck, testes unitários e build sempre; integração e E2E contra Postgres real
# quando o job correspondente rodar. Nenhum job aqui aplica migration em produção — isso
# continua manual (docs/deploy-easypanel.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # Lint + typecheck + testes unitários + build de produção — o mesmo build que o Dockerfile
  # roda, sem DATABASE_URL/AUTH_SECRET, para pegar cedo qualquer página que volte a depender de
  # env de runtime no build (docs/arquitetura.md — nenhuma página pode prerenderizar lendo o
  # banco).
  build-and-test:
    name: Lint, typecheck, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instala dependências (lockfile exato)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gera o Prisma Client
        run: npm run db:generate
        env:
          # Só para o `prisma generate` ler o provider do schema — não conecta em nada.
          DATABASE_URL: postgresql://user:pass@localhost:5432/innochat_ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      # Fluxo do bot: motor/cola embutidos em dia e versão em n8n/flow-versions.json em dia. Se o fluxo mudou
      # e a versão não subiu, falha aqui com a mensagem do que fazer (n8n/README.md, "Versão do fluxo").
      - name: Versão do fluxo do bot (trava)
        run: npm run build:flow -- --check

      - name: Build de produção (sem env de runtime, igual ao Dockerfile)
        run: npm run build

  # Testes de integração contra Postgres real (tests/integration/**, requer TEST_DATABASE_URL
  # com as migrations aplicadas — docs/contratos.md).
  integration:
    name: Testes de integração (Postgres real)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: innochat
          POSTGRES_PASSWORD: innochat
          POSTGRES_DB: innochat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://innochat:innochat@localhost:5432/innochat_test
      AUTH_SECRET: ci-secret-not-used-in-integration-tests-0000000000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera o Prisma Client
        run: npm run db:generate

      - name: Aplica migrations no banco de teste
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Testes de integração
        run: npm run test:integration

  # E2E (Playwright) contra `next start` + banco seedado. Best-effort no CI: `webServer` do
  # playwright.config.ts já sobe o servidor sozinho, então só precisamos do banco pronto e
  # seedado antes.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: innochat
          POSTGRES_PASSWORD: innochat
          POSTGRES_DB: innochat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://innochat:innochat@localhost:5432/innochat
      AUTH_SECRET: ci-secret-not-used-in-e2e-tests-00000000000000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera o Prisma Client
        run: npm run db:generate

      - name: Aplica migrations
        run: npx prisma migrate deploy

      - name: Popula o banco de dev (seed)
        run: npm run db:seed

      - name: Instala browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e

      - name: Sobe evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Backup: o dump VOLTA mesmo (ciclo completo em Postgres real). Abordagem do Parque das Feiras.
  # Backup que nunca foi restaurado é uma suposição, e testar uma vez à mão não basta: o schema muda
  # toda semana e a restauração precisa continuar funcionando DEPOIS de cada migration. Por isso o
  # ciclo inteiro (semear, dump CIFRADO, apagar tudo, decifrar e restaurar, conferir) roda a cada push.
  backup-restore:
    name: Backup, o dump volta mesmo (ciclo completo em Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mesma versão major dos outros jobs e do banco do Easypanel (17 ou 18; o cliente abaixo é o 18,
        # que dumpa servidor 17 e 18).
        image: postgres:18
        env:
          POSTGRES_USER: innochat
          POSTGRES_PASSWORD: innochat
          POSTGRES_DB: innochat_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://innochat:innochat@localhost:5432/innochat_backup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera o Prisma Client
        run: npm run db:generate

      # O cliente do runner precisa ser >= o servidor, senão o pg_dump recusa por diferença de versão.
      # Fixamos o 18 para casar com o Dockerfile (postgresql18-client) e com o serviço acima.
      - name: Instala o cliente do Postgres 18
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version

      - name: Cria o schema (as migrations de verdade)
        run: npx prisma migrate deploy

      - name: Semeia dados conhecidos
        run: node scripts/backup-smoke.mjs semear


      # O backup do painel sai CIFRADO (AES-256-GCM, formato em src/modules/backup/backup-crypto.ts). Aqui o
      # script de linha de comando produz o mesmo formato (BACKUP_KEY_FILE). A chave é gerada na hora e
      # nunca sai do runner. O teste cruzado sistema/script (os dois sentidos) roda no job de testes unitários.
      - name: Gera a chave do backup
        run: |
          printf 'CHAVE: %s\n' "$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" > "$RUNNER_TEMP/chave.txt"
          chmod 600 "$RUNNER_TEMP/chave.txt"
          node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))' | sed 's/^/CHAVE: /' > "$RUNNER_TEMP/chave-errada.txt"

      - name: Faz o backup cifrado
        run: |
          BACKUP_KEY_FILE="$RUNNER_TEMP/chave.txt" sh scripts/backup-db.sh ./backups
          ls -l ./backups

      - name: Confere que o backup saiu cifrado (sem dump em claro, ilegível sem a chave)
        run: |
          ls ./backups/backup-innochat-*.dump.enc
          if ls ./backups/*.dump >/dev/null 2>&1; then echo "ERRO: sobrou dump em claro"; exit 1; fi
          ENC="$(ls -1 ./backups/backup-innochat-*.dump.enc | head -1)"
          if pg_restore --list "$ENC" >/dev/null 2>&1; then echo "ERRO: o arquivo cifrado é lido como dump"; exit 1; fi
          if grep -aq "Clínica da Ação" "$ENC"; then echo "ERRO: texto da semente aparece no arquivo cifrado"; exit 1; fi
          node scripts/decrypt-backup.mjs "$ENC" --info

      # O DESASTRE, simulado: o banco some por completo. É contra isto que o backup existe, então é
      # exatamente isto que o teste precisa provocar.
      - name: Destrói o banco
        run: |
          psql "$DATABASE_URL" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          echo "Tabelas restantes:"
          psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';"

      # Casos negativos: com a chave errada, ou com o arquivo adulterado, a restauração tem que PARAR antes
      # de tocar no banco (que continua vazio) e sem deixar dump decifrado para trás.
      - name: Chave errada não restaura
        run: |
          ENC="$(ls -1 ./backups/backup-innochat-*.dump.enc | head -1)"
          if sh scripts/restore-db.sh "$ENC" "$DATABASE_URL" --confirmar --chave "$RUNNER_TEMP/chave-errada.txt"; then
            echo "ERRO: restaurou com a chave errada"; exit 1
          fi
          if node scripts/decrypt-backup.mjs "$ENC" --chave "$RUNNER_TEMP/chave-errada.txt" --saida "$RUNNER_TEMP/errada.dump"; then
            echo "ERRO: decifrou com a chave errada"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/errada.dump"
          N="$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")"
          test "$N" = "0"

      - name: Arquivo adulterado não restaura
        run: |
          ENC="$(ls -1 ./backups/backup-innochat-*.dump.enc | head -1)"
          node -e 'const fs=require("fs");const b=fs.readFileSync(process.argv[1]);b[b.length>>1]^=1;fs.writeFileSync(process.argv[2],b)' "$ENC" ./backups/adulterado.dump.enc
          if sh scripts/restore-db.sh ./backups/adulterado.dump.enc "$DATABASE_URL" --confirmar --chave "$RUNNER_TEMP/chave.txt"; then
            echo "ERRO: restaurou um arquivo adulterado"; exit 1
          fi
          N="$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")"
          test "$N" = "0"
          rm -f ./backups/adulterado.dump.enc

      - name: Decifra e restaura com a chave certa
        run: |
          ENC="$(ls -1 ./backups/backup-innochat-*.dump.enc | head -1)"
          sh scripts/restore-db.sh "$ENC" "$DATABASE_URL" --confirmar --chave "$RUNNER_TEMP/chave.txt"

      - name: Confere se os dados voltaram íntegros
        run: node scripts/backup-smoke.mjs conferir
